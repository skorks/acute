- reason: "a junk clock (a colon group that is not 2 to 6 plain fields) is not a clock to acute: the number beside it is read alone, or nothing"
  cases:
  - ["parse","100:00",{},6000,6000,null]
  - ["parse","1:2",{},62,62,null]
  - ["parse","1 : 20",{},80,80,20]
  - ["parse","1:2:3:4:5:6:7",{},{"error":"NoMethodError"},7,null]
  - ["parse","1:30 hours",{},108060,108000,90]
  - ["parse","2023:06:36:02",{},174810962,174810962,23762]
  - ["parse","100:00",{"raise_exceptions":true},6000,6000,{"error":"ChronicDuration::DurationParseError"}]
  - ["parse","1:2",{"raise_exceptions":true},62,62,{"error":"ChronicDuration::DurationParseError"}]
  - ["parse","1 : 20",{"raise_exceptions":true},80,80,{"error":"ChronicDuration::DurationParseError"}]
  - ["parse","2023:06:36:02",{"raise_exceptions":true},174810962,174810962,{"error":"ChronicDuration::DurationParseError"}]
- reason: "a bare number after hours or minutes is the next smaller unit (D44): \"1 hour 30\" is 90 minutes, where the gems add 30 seconds"
  cases:
