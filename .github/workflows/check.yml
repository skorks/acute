name: check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Shared runners are too noisy to judge microsecond budgets; the speed stages print their numbers only
  ACUTE_SPEED: report

jobs:
  check:
    name: bin/check (${{ matrix.os }}, Ruby ${{ matrix.ruby }}${{ matrix.tz && format(', TZ={0} LC_ALL={1}', matrix.tz, matrix.locale) || '' }})
    runs-on: ${{ matrix.os }}
    # Ruby head is an early warning, not a gate
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.3", "3.4", "4.0", head]
        # a key no other leg has, so this is a leg of its own rather than settings for the plain 4.0 one
        variant: [plain]
        include:
          - { os: ubuntu-latest, ruby: "4.0", variant: tz, tz: Pacific/Chatham, locale: tr_TR.UTF-8 }
          - { os: macos-latest, ruby: "4.0", variant: plain }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: System zoneinfo, the corpus's oracle
        run: test -f /usr/share/zoneinfo/America/New_York
      # Chronic gives system-local Times, and macOS's zoneinfo has no pre-1900 LMT, so its chronic stage
      # differs from the recorded "this day 1800"
      - if: ${{ !matrix.tz }}
        run: bundle exec bin/check --skip lint,coverage,gem${{ runner.os == 'macOS' && ',chronic' || '' }}
      - if: ${{ matrix.tz }}
        run: sudo locale-gen "$LOCALE"
        env:
          LOCALE: ${{ matrix.locale }}
      - if: ${{ matrix.tz }}
        run: bundle exec bin/check --skip lint,coverage,gem
        env:
          TZ: ${{ matrix.tz }}
          LC_ALL: ${{ matrix.locale }}

  # Windows has no system zoneinfo for the corpus's oracle, so the corpus stage is left out, and the unit
  # test of bin/case, which checks against it, skips
  windows:
    name: bin/check (windows-latest, Ruby 4.0, no corpus)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      # The chronic stage's oracle is chronic's system-local Times under TZ=America/New_York, which Windows' C
      # runtime doesn't read, so its Times stay UTC. The speed stages' CPU clocks give NaN here; they are
      # report-only in CI anyway
      - run: bundle exec ruby bin/check --skip lint,corpus,chronic,coverage,gem,speed,yjit

  once:
    name: lint, coverage and the gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec bin/check --only lint
      - run: bundle exec bin/check --only coverage
      - run: bundle exec bin/check --only gem
