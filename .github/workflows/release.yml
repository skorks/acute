# The filename and the environment name are what the RubyGems trusted publisher matches; renaming either breaks publishing
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # The development gems run here, in a job that can't publish: none of them can mint the OIDC token, nor touch the
  # tree the gem is built from
  check:
    name: bin/check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACUTE_SPEED: report
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No bundler cache: a release shouldn't run gems restored from a cache another run wrote
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "4.0"
      - run: bundle install
      - run: bundle exec bin/check

  release:
    name: publish to RubyGems
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No bundle: the gem is built by RubyGems from the tagged tree alone
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "4.0"
      - name: The tag names this version, on main
        run: |
          version="$(ruby -Ilib -racute/version -e 'print Acute::VERSION')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME is not v$version from lib/acute/version.rb"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          echo "GEM=acute-$version.gem" >> "$GITHUB_ENV"
      - run: gem build acute.gemspec --output "$GEM"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.GEM }}
      # Trusted publishing: a short-lived key from GitHub's OIDC token, so no API key is stored anywhere
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push, with the provenance for rubygems.org to show
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          gem push --attestation "$BUNDLE" "$GEM" || {
            echo "::warning::rubygems.org refused the attestation; pushing without it (GitHub still holds it)"
            gem push "$GEM"
          }
