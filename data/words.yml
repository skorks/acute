# Words that are also plain English. In extraction they need a neighbour that confirms the date reading.
english: [may, march, following, sat, sun, tu, fr, second, fall, a, mon, wed, start, end, last, past, this, next, d, m, s, h, w, y, lunch,
          boy]

# D44: plurals, which only count ("3 fridays from now"); alone they recur, which is not a time. Plural units
# let "2 upcoming weeks" be "next 2 weeks" while "3 next week" is not.
plural: [sundays, mondays, tuesdays, wednesdays, thursdays, fridays, saturdays, black fridays, memorial days,
         secs, seconds, mins, minutes, hrs, hours, days, wks, weeks, fortnights, months, quarters, yrs, years,
         decades, centuries]

# D18: a fixed table, only misspellings the corpus has. Each maps to the word it stands for.
misspellings:
  tommorow: tomorrow
  tonite: tonight
  febuary: february
  wensday: wednesday
