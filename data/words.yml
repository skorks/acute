  today: 0
  tomorrow: 1
  tmrw: 1
  tmr: 1
  yesterday: -1

meridiem:       # value: hours added to 1-12
  am: 0
  a.m: 0
  pm: 12
  p.m: 12
  p: 12

named:          # value: the hour it names
  noon: 12
  midday: 12
  midnight: 0

now:
  now: 0

at:
  at: 0

